name: Bug report
description: Report something that is broken or incorrect.
title: "fix(<area>): <short description>"
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include errors and symptoms.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact secrets).
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, SHA, or release version.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "low"
        - "medium"
        - "high"
        - "critical"
    validations:
      required: true
